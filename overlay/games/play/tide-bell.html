<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Tide Bell</title>
<style>
html,body{margin:0;height:100%;background:#0e1c28;overflow:hidden;color:#e7f6ff;font-family:system-ui,sans-serif}
canvas{width:100%;height:100%;display:block;touch-action:manipulation}
#hud{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;font-weight:700;pointer-events:none;text-shadow:0 1px 4px #000}
#hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;opacity:.8;pointer-events:none}
#over{position:absolute;inset:0;display:none;place-items:center;background:rgba(4,10,16,.62)}
.card{background:#142838;border:1px solid #9ad7ff55;border-radius:16px;padding:1.2rem 1.4rem;text-align:center}
button{font:inherit;background:#b7ecff;color:#10202a;border:0;border-radius:999px;padding:.6rem 1.1rem;font-weight:800;min-height:44px;cursor:pointer}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><span id="sc">0 bells</span><span id="lives">3 listens</span></div>
<div id="hint">← → or tap a side to face the ringing bell</div>
<div id="over"><div class="card"><h1>Tide out</h1><p id="os"></p><button id="again" type="button">Listen again</button></div></div>
<script src="/games/play/ps-score.js?v=20261007id1"></script>
<script src="/games/play/ps-gate.js?v=20261007id1"></script>
<script>
(() => {
  const N=6;
  const c=document.getElementById("c"), g=c.getContext("2d");
  let w=1,h=1,face=0,target=2,left=1.4,score=0,lives=3,running=false,last=0,windowT=1.4;
  function resize(){const d=Math.min(2,devicePixelRatio||1); w=c.clientWidth||320; h=c.clientHeight||240; c.width=Math.floor(w*d); c.height=Math.floor(h*d); g.setTransform(d,0,0,d,0,0);}
  function hud(){document.getElementById("sc").textContent=score+" bells"; document.getElementById("lives").textContent=lives+" listens";}
  function nextBell(){
    let n=target; while(n===target) n=Math.floor(Math.random()*N);
    target=n; windowT=Math.max(0.55, 1.45-score*0.04); left=windowT;
  }
  function reset(){ face=0; target=2; score=0; lives=3; running=true; last=0; windowT=1.4; left=1.4; document.getElementById("over").style.display="none"; hud(); }
  function end(){ running=false; document.getElementById("os").textContent=score+" bells faced"; document.getElementById("over").style.display="grid"; psReport("tide-bell", score); }
  function turn(d){ if(running) face=(face+d+N)%N; }
  addEventListener("keydown", e=>{
    if(e.code==="ArrowLeft"||e.code==="KeyA"){ e.preventDefault(); turn(-1); }
    if(e.code==="ArrowRight"||e.code==="KeyD"){ e.preventDefault(); turn(1); }
  });
  c.addEventListener("pointerdown", e=>{
    const r=c.getBoundingClientRect();
    turn((e.clientX-r.left)<r.width/2?-1:1);
  });
  document.getElementById("again").onclick=reset;
  function frame(ts){
    if(!last) last=ts; const dt=Math.min(0.033,(ts-last)/1000); last=ts;
    if(running){
      left-=dt;
      if(left<=0){
        if(face===target){ score++; hud(); nextBell(); }
        else { lives--; hud(); if(lives<=0) end(); else nextBell(); }
      }
    }
    g.fillStyle="#102433"; g.fillRect(0,0,w,h);
    const cx=w/2, cy=h/2+8, R=Math.min(w,h)*0.32;
    g.strokeStyle="rgba(154,215,255,.25)"; g.lineWidth=2; g.beginPath(); g.arc(cx,cy,R,0,6.3); g.stroke();
    for(let i=0;i<N;i++){
      const a=-Math.PI/2+i*(Math.PI*2/N);
      const x=cx+Math.cos(a)*R, y=cy+Math.sin(a)*R;
      g.fillStyle=i===target?"#f0c27a":"#1d3c52";
      g.beginPath(); g.arc(x,y, i===target?16:12, 0, 6.3); g.fill();
      g.fillStyle="#e7f6ff"; g.font="700 12px system-ui"; g.fillText(String(i+1), x-4, y+4);
    }
    const fa=-Math.PI/2+face*(Math.PI*2/N);
    g.strokeStyle="#b7ecff"; g.lineWidth=4;
    g.beginPath(); g.moveTo(cx,cy); g.lineTo(cx+Math.cos(fa)*(R-28), cy+Math.sin(fa)*(R-28)); g.stroke();
    g.fillStyle="#e7f6ff"; g.beginPath(); g.arc(cx,cy,8,0,6.3); g.fill();
    const frac=Math.max(0,left/windowT);
    g.strokeStyle="#f0c27a"; g.lineWidth=6; g.beginPath(); g.arc(cx,cy,R+22,-Math.PI/2,-Math.PI/2+frac*6.28); g.stroke();
    requestAnimationFrame(frame);
  }
  resize(); new ResizeObserver(resize).observe(c); reset(); running=false; requestAnimationFrame(frame);
  window.psBeginGame=function(){ if(typeof reset==="function") reset(); };
})();
</script></body></html>
