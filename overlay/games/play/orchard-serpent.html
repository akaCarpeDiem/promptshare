<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Orchard Serpent</title>
<style>
html,body{margin:0;height:100%;background:#142016;overflow:hidden;color:#f3ffe8;font-family:system-ui,sans-serif}
canvas{width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:700;pointer-events:none;text-shadow:0 1px 4px #000}
#over{position:absolute;inset:0;display:none;place-items:center;background:rgba(6,12,8,.55)}
.card{background:#1c2c1e;border:1px solid #b6e7a266;border-radius:16px;padding:1.1rem 1.3rem;text-align:center}
button{font:inherit;background:#c6ef9a;color:#142010;border:0;border-radius:999px;padding:.55rem .9rem;font-weight:700;min-height:44px;cursor:pointer}
.pad{position:absolute;bottom:10px;left:10px;display:grid;grid-template-columns:44px 44px 44px;gap:4px}
.pad button{padding:0}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><span id="sc">0</span><span id="gh"></span></div>
<div class="pad">
  <span></span><button type="button" data-d="0,-1">↑</button><span></span>
  <button type="button" data-d="-1,0">←</button><button type="button" data-d="0,1">↓</button><button type="button" data-d="1,0">→</button>
</div>
<div id="over"><div class="card"><h1>Rooted</h1><p id="os"></p><button id="again" type="button">Grow again</button></div></div>
<script src="/games/play/ps-score.js?v=20261007id1"></script>
<script src="/games/play/ps-gate.js?v=20261007id1"></script>
<script>
(() => {
  const COLS=18, ROWS=16;
  const c=document.getElementById("c"), g=c.getContext("2d");
  let w=1,h=1,cell=16, ox=0, oy=0, snake, dir, next, fruit, walls, score, tick, acc, ghost, fruitsEaten, running, last;
  function resize(){const d=Math.min(2,devicePixelRatio||1); w=c.clientWidth||320; h=c.clientHeight||240; c.width=Math.floor(w*d); c.height=Math.floor(h*d); g.setTransform(d,0,0,d,0,0);
    cell=Math.floor(Math.min((w-20)/COLS, (h-70)/ROWS)); ox=Math.floor((w-cell*COLS)/2); oy=36;
  }
  function emptyCell(){
    for(let n=0;n<80;n++){
      const x=1+Math.floor(Math.random()*(COLS-2)), y=1+Math.floor(Math.random()*(ROWS-2));
      if(snake.some(s=>s.x===x&&s.y===y)) continue;
      if(walls.some(s=>s.x===x&&s.y===y)) continue;
      return {x,y};
    }
    return {x:2,y:2};
  }
  function reset(){
    snake=[{x:6,y:8},{x:5,y:8},{x:4,y:8}]; dir={x:1,y:0}; next={x:1,y:0};
    walls=[]; score=0; tick=0.16; acc=0; ghost=0; fruitsEaten=0; running=true; last=0;
    fruit={...emptyCell(), moon:false};
    document.getElementById("over").style.display="none"; hud();
  }
  function hud(){ document.getElementById("sc").textContent=score+" fruit"; document.getElementById("gh").textContent = ghost>0 ? "ghost "+ghost.toFixed(1)+"s" : "walls "+walls.length; }
  function setDir(x,y){ if(x===-dir.x && y===-dir.y) return; next={x,y}; }
  addEventListener("keydown", e=>{
    const map={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],KeyW:[0,-1],KeyS:[0,1],KeyA:[-1,0],KeyD:[1,0]};
    if(map[e.code]){ e.preventDefault(); setDir(...map[e.code]); }
  });
  document.querySelectorAll(".pad button").forEach(b=>b.addEventListener("click", ()=>{ const [x,y]=b.dataset.d.split(",").map(Number); setDir(x,y); }));
  let sx=0,sy=0;
  c.addEventListener("pointerdown", e=>{sx=e.clientX; sy=e.clientY;});
  c.addEventListener("pointerup", e=>{
    const dx=e.clientX-sx, dy=e.clientY-sy; if(Math.hypot(dx,dy)<24) return;
    if(Math.abs(dx)>Math.abs(dy)) setDir(Math.sign(dx),0); else setDir(0, Math.sign(dy));
  });
  document.getElementById("again").onclick=reset;
  function growWall(){
    const edge=Math.floor(Math.random()*4);
    let x,y,dx,dy;
    if(edge===0){x=0;y=1+Math.floor(Math.random()*(ROWS-2));dx=1;dy=0;}
    else if(edge===1){x=COLS-1;y=1+Math.floor(Math.random()*(ROWS-2));dx=-1;dy=0;}
    else if(edge===2){y=0;x=1+Math.floor(Math.random()*(COLS-2));dx=0;dy=1;}
    else {y=ROWS-1;x=1+Math.floor(Math.random()*(COLS-2));dx=0;dy=-1;}
    for(let i=0;i<3;i++){ const cx=x+dx*i, cy=y+dy*i; if(cx<=0||cy<=0||cx>=COLS-1||cy>=ROWS-1) break; if(!walls.some(w=>w.x===cx&&w.y===cy)) walls.push({x:cx,y:cy}); }
  }
  function step(){
    dir=next; const head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
    if(head.x<0||head.y<0||head.x>=COLS||head.y>=ROWS) return die();
    if(walls.some(w=>w.x===head.x&&w.y===head.y)) return die();
    const hitSelf=snake.some(s=>s.x===head.x&&s.y===head.y);
    if(hitSelf && ghost<=0) return die();
    snake.unshift(head);
    if(head.x===fruit.x && head.y===fruit.y){
      score += fruit.moon? 3:1; fruitsEaten++;
      if(fruit.moon) ghost=4.2;
      if(fruitsEaten%3===0) growWall();
      tick=Math.max(0.07, 0.16-fruitsEaten*0.004);
      fruit={...emptyCell(), moon: Math.random()<0.18};
    } else snake.pop();
    hud();
  }
  function die(){ running=false; document.getElementById("os").textContent=score+" fruit · "+walls.length+" blossom walls"; document.getElementById("over").style.display="grid"; psReport("orchard-serpent", score); }
  function frame(ts){
    if(!last) last=ts; const dt=Math.min(0.05,(ts-last)/1000); last=ts;
    if(running){ if(ghost>0) ghost-=dt; acc+=dt; if(acc>=tick){ acc=0; step(); } }
    g.fillStyle="#142016"; g.fillRect(0,0,w,h);
    g.fillStyle="#1c2a1c"; g.fillRect(ox,oy,cell*COLS,cell*ROWS);
    g.fillStyle="#6a3a55"; walls.forEach(t=>g.fillRect(ox+t.x*cell+1, oy+t.y*cell+1, cell-2, cell-2));
    if(fruit){ g.fillStyle=fruit.moon?"#d7e7ff":"#e23b4a"; g.beginPath(); g.arc(ox+fruit.x*cell+cell/2, oy+fruit.y*cell+cell/2, cell*0.32, 0, 6.3); g.fill(); }
    snake.forEach((s,i)=>{ g.fillStyle = ghost>0 && i>0 ? "rgba(186,230,140,.45)" : (i? "#8dce62":"#e8ffc8"); g.fillRect(ox+s.x*cell+1, oy+s.y*cell+1, cell-2, cell-2); });
    requestAnimationFrame(frame);
  }
  resize(); new ResizeObserver(resize).observe(c); reset(); running=false; requestAnimationFrame(frame);
  window.psBeginGame=function(){ if(typeof reset==="function") reset(); };
})();
</script></body></html>
