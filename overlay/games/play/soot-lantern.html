<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Soot Lantern</title>
<style>
html,body{margin:0;height:100%;background:#100e0c;overflow:hidden;color:#f6efe4;font-family:system-ui,sans-serif}
canvas{width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:700;pointer-events:none;text-shadow:0 1px 4px #000;font-size:14px}
#hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;opacity:.75;pointer-events:none;font-size:.85rem}
#over{position:absolute;inset:0;display:none;place-items:center;background:rgba(8,6,4,.66)}
.card{background:#221c16;border:1px solid #e7c27a55;border-radius:16px;padding:1.2rem 1.4rem;text-align:center;max-width:22rem}
button{font:inherit;background:#f0d2a4;color:#2a1c10;border:0;border-radius:999px;padding:.6rem 1.1rem;font-weight:800;min-height:44px;cursor:pointer}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><span id="oil">oil</span><span id="sc">0 drops</span></div>
<div id="hint">WASD or arrows. Gold drops refill oil. Amber shutters close — don't stand in them. Reach the stair.</div>
<div id="over"><div class="card"><h1 id="ot"></h1><p id="os"></p><button id="again" type="button">Walk again</button></div></div>
<script src="/games/play/ps-score.js?v=20261007id1"></script>
<script src="/games/play/ps-gate.js?v=20261007id1"></script>
<script>
(() => {
  const MAP = [
    "####################",
    "#S......O....#.....#",
    "#.###.####...#.###.#",
    "#...#....#...#...#.#",
    "#.#.#.##.#.###.#.#.#",
    "#.#...#..O...#..O#.#",
    "#.#####.####.#.##.##",
    "#.....#......#.....#",
    "#.###.#.####.###.#.#",
    "#O..#...S..#...#.#.#",
    "#.#.###.##.###.#...#",
    "#...#.......S......X",
    "####################"
  ];
  const ROWS=MAP.length, COLS=MAP[0].length;
  const c=document.getElementById("c"), g=c.getContext("2d");
  const keys={};
  let w=1,h=1,px,py,oil,drops,got,shut,shutT,running,last,cell;
  function resize(){const d=Math.min(2,devicePixelRatio||1); w=c.clientWidth||320; h=c.clientHeight||240; c.width=Math.floor(w*d); c.height=Math.floor(h*d); g.setTransform(d,0,0,d,0,0); cell=Math.min((w-16)/COLS,(h-16)/ROWS);}
  function tile(x,y){ if(y<0||x<0||y>=ROWS||x>=COLS) return "#"; return MAP[y][x]; }
  function blocked(x,y){ const t=tile(x,y); return t==="#"; }
  function reset(){
    px=2; py=1; oil=28; drops=0; got={}; shut=false; shutT=0; running=true; last=0;
    document.getElementById("over").style.display="none"; hud();
  }
  function hud(){
    document.getElementById("oil").textContent="oil "+Math.max(0,oil).toFixed(0);
    document.getElementById("sc").textContent=drops+" drops";
  }
  function points(won){ return drops*50 + (won ? 300+Math.max(0,Math.floor(oil))*2 : 0); }
  function end(title, won){
    running=false;
    const pts=points(won);
    document.getElementById("ot").textContent=title;
    document.getElementById("os").textContent=(won?"The stair is lit. ":"The glass went dark. ")+drops+" drops · score "+pts;
    document.getElementById("over").style.display="grid";
    psReport("soot-lantern", pts);
  }
  function tryMove(dx,dy){
    if(!running) return;
    const nx=px+dx, ny=py+dy;
    if(blocked(nx,ny)) return;
    if(shut && tile(nx,ny)==="S") return;
    px=nx; py=ny;
    const t=tile(px,py);
    const k=px+","+py;
    if(t==="O" && !got[k]){ got[k]=true; drops++; oil=Math.min(40, oil+9); }
    if(t==="X") end("Stair found", true);
    hud();
  }
  addEventListener("keydown", e=>{
    const map={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};
    if(map[e.code]){ e.preventDefault(); if(!keys[e.code]){ keys[e.code]=true; tryMove(map[e.code][0], map[e.code][1]); } }
  });
  addEventListener("keyup", e=>{ keys[e.code]=false; });
  let joy=null;
  c.addEventListener("pointerdown", e=>{ joy={id:e.pointerId,x:e.clientX,y:e.clientY}; });
  c.addEventListener("pointerup", e=>{
    if(!joy||joy.id!==e.pointerId) return;
    const dx=e.clientX-joy.x, dy=e.clientY-joy.y; joy=null;
    if(Math.hypot(dx,dy)<12) return;
    if(Math.abs(dx)>Math.abs(dy)) tryMove(dx>0?1:-1,0); else tryMove(0,dy>0?1:-1);
  });
  document.getElementById("again").onclick=reset;
  function frame(ts){
    if(!last) last=ts; const dt=Math.min(0.05,(ts-last)/1000); last=ts;
    if(running){
      oil-=dt*1.7; shutT+=dt;
      if(shutT>2.4){ shut=!shut; shutT=0; if(shut && tile(px,py)==="S"){ oil-=8; } }
      hud();
      if(oil<=0) end("Oil spent", false);
    }
    g.fillStyle="#1a1612"; g.fillRect(0,0,w,h);
    const ox=(w-COLS*cell)/2, oy=(h-ROWS*cell)/2;
    for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
      const t=MAP[y][x];
      const X=ox+x*cell, Y=oy+y*cell;
      if(t==="#"){ g.fillStyle="#3a3028"; g.fillRect(X,Y,cell-1,cell-1); }
      else {
        g.fillStyle="#2a241c"; g.fillRect(X,Y,cell-1,cell-1);
        if(t==="O" && !got[x+","+y]){ g.fillStyle="#f0c27a"; g.beginPath(); g.arc(X+cell/2,Y+cell/2,cell*0.18,0,6.3); g.fill(); }
        if(t==="S"){ g.fillStyle=shut?"#c47a3a":"rgba(240,194,122,.35)"; g.fillRect(X+2,Y+2,cell-5,cell-5); }
        if(t==="X"){ g.fillStyle="#9ad7c2"; g.fillRect(X+cell*0.25,Y+2,cell*0.5,cell-4); }
      }
    }
    const rad=cell*(1.6+oil/30);
    const lg=g.createRadialGradient(ox+(px+0.5)*cell, oy+(py+0.5)*cell, 4, ox+(px+0.5)*cell, oy+(py+0.5)*cell, rad);
    lg.addColorStop(0,"rgba(255,214,140,.45)"); lg.addColorStop(1,"rgba(255,214,140,0)");
    g.fillStyle=lg; g.fillRect(0,0,w,h);
    g.fillStyle="#f6efe4"; g.beginPath(); g.arc(ox+(px+0.5)*cell, oy+(py+0.5)*cell, cell*0.28, 0, 6.3); g.fill();
    requestAnimationFrame(frame);
  }
  resize(); new ResizeObserver(resize).observe(c); reset(); running=false; requestAnimationFrame(frame);
  window.psBeginGame=function(){ if(typeof reset==="function") reset(); };
})();
</script></body></html>
