<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Gate Comet</title>
<style>
html,body{margin:0;height:100%;background:#0e121c;overflow:hidden;color:#eef6ff;font-family:system-ui,sans-serif}
canvas{width:100%;height:100%;display:block;touch-action:manipulation}
#hud{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;font-weight:700;pointer-events:none;text-shadow:0 1px 4px #000}
#hint{position:absolute;bottom:16px;left:0;right:0;text-align:center;opacity:.75;pointer-events:none;font-size:.9rem}
#over{position:absolute;inset:0;display:none;place-items:center;background:rgba(6,8,14,.6)}
.card{background:#171c2a;border:1px solid #9ad7ff55;border-radius:16px;padding:1.2rem 1.4rem;text-align:center}
button{font:inherit;background:#b7ecff;color:#10202a;border:0;border-radius:999px;padding:.6rem 1.1rem;font-weight:700;min-height:44px;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="score">0</span><span id="lives">3 lives</span></div>
<div id="hint">Tap or press Space while the comet is in the gate</div>
<div id="over"><div class="card"><h1>Orbit lost</h1><p id="os"></p><button id="again" type="button">Play again</button></div></div>
<script src="/games/play/ps-score.js?v=20261007id1"></script>
<script src="/games/play/ps-gate.js?v=20261007id1"></script>
<script>
(() => {
  const c = document.getElementById("c"), g = c.getContext("2d");
  let w=1,h=1,ang=0,speed=1.15,gate=1.2,gateW=0.7,score=0,streak=0,lives=3,running=false,last=0,flash=0;
  const scoreEl=document.getElementById("score"), livesEl=document.getElementById("lives"), over=document.getElementById("over");
  function resize(){const d=Math.min(2,devicePixelRatio||1); w=c.clientWidth||320; h=c.clientHeight||240; c.width=Math.floor(w*d); c.height=Math.floor(h*d); g.setTransform(d,0,0,d,0,0);}
  function angDiff(a,b){let d=a-b; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2; return d;}
  function reset(){ang=0;speed=1.15;gate=1.2;gateW=0.7;score=0;streak=0;lives=3;running=true;last=0;flash=0; over.style.display="none"; paintHud();}
  function paintHud(){scoreEl.textContent=score+"  ·  streak "+streak; livesEl.textContent=lives+" lives";}
  function tap(){
    if(!running) return;
    const d=Math.abs(angDiff(ang, gate));
    if(d < gateW/2){
      const perfect=d < gateW*0.22;
      score += perfect? 25+streak*3 : 10+streak;
      streak++; speed=Math.min(3.4, speed+0.07); gateW=Math.max(0.22, gateW-0.025);
      gate = Math.random()*Math.PI*2; flash = perfect? 0.18: 0.1;
    } else { streak=0; lives--; flash=-0.2; if(lives<=0){ running=false; document.getElementById("os").textContent=score+" points"; over.style.display="grid"; psReport("gate-comet", score); } }
    paintHud();
  }
  addEventListener("keydown", e=>{ if(e.code==="Space"){ e.preventDefault(); tap(); }});
  c.addEventListener("pointerdown", tap);
  document.getElementById("again").onclick=reset;
  function frame(ts){
    if(!last) last=ts; const dt=Math.min(0.033,(ts-last)/1000); last=ts;
    if(running) ang += speed*dt;
    if(flash>0) flash-=dt; if(flash<0) flash+=dt;
    const cx=w/2, cy=h/2, R=Math.min(w,h)*0.32;
    g.fillStyle="#0e121c"; g.fillRect(0,0,w,h);
    g.strokeStyle="#243044"; g.lineWidth=10; g.beginPath(); g.arc(cx,cy,R,0,6.3); g.stroke();
    g.strokeStyle=flash<0?"#ff8d9a":"#7ee7f5"; g.lineWidth=14;
    g.beginPath(); g.arc(cx,cy,R, gate-gateW/2, gate+gateW/2); g.stroke();
    const x=cx+Math.cos(ang)*R, y=cy+Math.sin(ang)*R;
    g.fillStyle="#f4fbff"; g.beginPath(); g.arc(x,y,8,0,6.3); g.fill();
    g.strokeStyle="rgba(126,231,245,.7)"; g.lineWidth=3;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x-Math.cos(ang)*22, y-Math.sin(ang)*22); g.stroke();
    requestAnimationFrame(frame);
  }
  resize(); new ResizeObserver(resize).observe(c); paintHud(); requestAnimationFrame(frame);
  window.psBeginGame=function(){ if(typeof reset==="function") reset(); };
})();
</script>
</body>
</html>
