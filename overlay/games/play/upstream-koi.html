<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Upstream Koi</title>
<style>
html,body{margin:0;height:100%;background:#0e2430;overflow:hidden;color:#e9fbff;font-family:system-ui,sans-serif}
canvas{width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;font-weight:700;pointer-events:none}
#over{position:absolute;inset:0;display:none;place-items:center;background:rgba(4,12,18,.55)}
.card{background:#123040;border:1px solid #7ee7f555;border-radius:16px;padding:1.2rem 1.4rem;text-align:center}
button, .pad button{font:inherit;background:#9ae7f5;color:#062028;border:0;border-radius:999px;padding:.55rem 1rem;font-weight:700;min-height:44px;cursor:pointer}
.pad{position:absolute;bottom:14px;right:14px;display:flex;gap:8px}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><span id="sc">0</span><span id="sp">current</span></div>
<div class="pad"><button id="duck" type="button">Duck</button><button id="leap" type="button">Leap</button></div>
<div id="over"><div class="card"><h1>Swept back</h1><p id="os"></p><button id="again" type="button">Swim again</button></div></div>
<script src="/games/play/ps-score.js?v=20261007id1"></script>
<script src="/games/play/ps-gate.js?v=20261007id1"></script>
<script>
(() => {
  const c=document.getElementById("c"), g=c.getContext("2d");
  let w=1,h=1,y,vy,duck=0,obs=[],coins=[],score=0,dist=0,running=false,last=0,spawn=0,scroll=0;
  const groundRatio=0.78;
  function resize(){const d=Math.min(2,devicePixelRatio||1); w=c.clientWidth||320; h=c.clientHeight||240; c.width=Math.floor(w*d); c.height=Math.floor(h*d); g.setTransform(d,0,0,d,0,0);}
  function ground(){return h*groundRatio;}
  function reset(){ y=ground()-28; vy=0; duck=0; obs=[]; coins=[]; score=0; dist=0; running=true; spawn=0.4; scroll=0; document.getElementById("over").style.display="none"; }
  function jump(){ if(running && y>=ground()-30) vy=-460; }
  function setDuck(on){ duck=on?0.45:0; }
  document.getElementById("leap").onclick=jump;
  const db=document.getElementById("duck");
  db.addEventListener("pointerdown", e=>{e.preventDefault(); setDuck(true);});
  db.addEventListener("pointerup", ()=>setDuck(false));
  db.addEventListener("pointerleave", ()=>setDuck(false));
  addEventListener("keydown", e=>{
    if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault(); jump();}
    if(e.code==="ArrowDown"||e.code==="KeyS") setDuck(true);
  });
  addEventListener("keyup", e=>{ if(e.code==="ArrowDown"||e.code==="KeyS") setDuck(false); });
  document.getElementById("again").onclick=reset;
  function die(){ running=false; document.getElementById("os").textContent=score+" scales · "+Math.floor(dist)+"m"; document.getElementById("over").style.display="grid"; psReport("upstream-koi", score*20+Math.floor(dist)); }
  function frame(ts){
    if(!last) last=ts; const dt=Math.min(0.033,(ts-last)/1000); last=ts;
    const spd=180+dist*0.35;
    if(running){
      dist+=spd*dt*0.05; scroll+=spd*dt;
      if(duck>0) duck-=dt;
      vy+=1200*dt; y+=vy*dt; if(y>ground()-28){ y=ground()-28; vy=0; }
      spawn-=dt;
      if(spawn<=0){
        spawn=1.05+Math.random()*0.4;
        if(Math.random()<0.55) obs.push({x:w+10, kind:"rock", w:36, h:28});
        else obs.push({x:w+10, kind:"net", w:46, h:70});
        if(Math.random()<0.7) coins.push({x:w+80, y:ground()-90-Math.random()*40, got:false});
      }
      const bodyTop = duck>0 ? y+6 : y-16;
      const bodyBot = y+16;
      obs.forEach(o=>o.x-=spd*dt); coins.forEach(o=>o.x-=spd*dt);
      for(const o of obs){
        const ox=o.x, top = o.kind==="rock" ? ground()-o.h : 40;
        const bot = o.kind==="rock" ? ground() : 40+o.h;
        const hitX = 78+22>ox && 78-18<ox+o.w;
        const hitY = bodyBot>top && bodyTop<bot;
        if(hitX && hitY) die();
      }
      coins.forEach(o=>{ if(!o.got && Math.abs(o.x-78)<22 && Math.abs(o.y-y)<22){ o.got=true; score++; }});
      obs=obs.filter(o=>o.x>-80); coins=coins.filter(o=>o.x>-40 && !o.got);
      document.getElementById("sc").textContent=score+" scales";
      document.getElementById("sp").textContent=Math.floor(dist)+"m";
    }
    g.fillStyle="#0e2430"; g.fillRect(0,0,w,h);
    g.fillStyle="#16485a"; g.fillRect(0, ground()-8, w, h);
    g.fillStyle="#8fd0c8";
    for(let i=0;i<8;i++){ const x=((i*140 - scroll*0.4)% (w+140)+w+140)%(w+140)-40; g.fillRect(x, ground()-6, 50, 3); }
    g.fillStyle="#6a5344";
    obs.forEach(o=>{ if(o.kind==="rock") g.fillRect(o.x, ground()-o.h, o.w, o.h); else { g.fillStyle="#d7e7c8"; g.fillRect(o.x, 30, o.w, o.h); g.fillStyle="#6a5344"; }});
    g.fillStyle="#f2c14e"; coins.forEach(o=>{ g.beginPath(); g.arc(o.x,o.y,7,0,6.3); g.fill(); });
    g.save(); g.translate(78, y);
    g.fillStyle="#e25b45"; g.beginPath(); g.ellipse(0,0,26, duck>0?8:12, 0,0,6.3); g.fill();
    g.fillStyle="#f4efe4"; g.beginPath(); g.ellipse(10, duck>0?2:-2, 8, 5, 0,0,6.3); g.fill();
    g.fillStyle="#222"; g.fillRect(18,-2,3,3);
    g.restore();
    requestAnimationFrame(frame);
  }
  resize(); new ResizeObserver(resize).observe(c); reset(); running=false; requestAnimationFrame(frame);
  window.psBeginGame=function(){ if(typeof reset==="function") reset(); };
})();
</script></body></html>
