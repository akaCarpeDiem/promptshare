<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rally</title>
  <style>
    html, body { margin: 0; height: 100%; background: #12131c; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let w = 640, h = 360, dpr = 1;
function fit() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  w = canvas.clientWidth || 640;
  h = canvas.clientHeight || 360;
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
}
addEventListener("resize", fit);
const ball = { x: 0.5, y: 0.32, vx: 0.42, vy: 0.34 };
let paddle = 0.5;
let rally = 0;
function setPaddle(clientX) {
  const r = canvas.getBoundingClientRect();
  paddle = Math.min(0.84, Math.max(0.16, (clientX - r.left) / r.width));
}
canvas.addEventListener("pointermove", (e) => setPaddle(e.clientX));
canvas.addEventListener("pointerdown", (e) => { canvas.setPointerCapture?.(e.pointerId); setPaddle(e.clientX); });
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  fit();
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;
  if (ball.x < 0.03) { ball.x = 0.03; ball.vx = Math.abs(ball.vx); }
  if (ball.x > 0.97) { ball.x = 0.97; ball.vx = -Math.abs(ball.vx); }
  if (ball.y < 0.06) { ball.y = 0.06; ball.vy = Math.abs(ball.vy); }
  const py = 0.88;
  if (ball.vy > 0 && ball.y >= py - 0.03 && ball.y <= py + 0.04 && Math.abs(ball.x - paddle) < 0.12) {
    ball.y = py - 0.03;
    ball.vy = -Math.abs(ball.vy) * 1.02;
    ball.vx += (ball.x - paddle) * 1.6;
    rally += 1;
  } else if (ball.y > 1.05) {
    ball.x = 0.5;
    ball.y = 0.32;
    ball.vx = 0.42 * (Math.random() < 0.5 ? -1 : 1);
    ball.vy = 0.34;
    rally = 0;
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#12131c";
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = "rgba(196,166,255,0.4)";
  ctx.lineWidth = 2;
  ctx.strokeRect(10, 10, w - 20, h - 20);
  ctx.fillStyle = "#7ee7f5";
  ctx.fillRect(paddle * w - w * 0.11, py * h, w * 0.22, 12);
  ctx.fillStyle = "#f4f1ff";
  ctx.beginPath();
  ctx.arc(ball.x * w, ball.y * h, Math.max(7, w * 0.012), 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#c4a6ff";
  ctx.font = "600 32px Outfit, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(String(rally), w / 2, 52);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
