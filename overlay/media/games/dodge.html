<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fall dodge</title>
  <style>
    html, body { margin: 0; height: 100%; background: #12131c; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let w = 640, h = 360, dpr = 1;
let player = 0.5;
let seconds = 0;
let alive = true;
let blocks = [];
let spawn = 0;
const keys = new Set();
function fit() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  w = canvas.clientWidth || 640;
  h = canvas.clientHeight || 360;
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
}
addEventListener("resize", fit);
addEventListener("keydown", (e) => { if (e.key.startsWith("Arrow")) { keys.add(e.key); e.preventDefault(); } });
addEventListener("keyup", (e) => keys.delete(e.key));
function drag(e) {
  const r = canvas.getBoundingClientRect();
  player = Math.min(0.92, Math.max(0.08, (e.clientX - r.left) / r.width));
}
canvas.addEventListener("pointerdown", (e) => { if (!alive) reset(); canvas.setPointerCapture?.(e.pointerId); drag(e); });
canvas.addEventListener("pointermove", (e) => { if (e.buttons || e.pointerType !== "mouse") drag(e); });
function reset() {
  alive = true; seconds = 0; blocks = []; spawn = 0; player = 0.5;
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  fit();
  if (alive) {
    seconds += dt;
    if (keys.has("ArrowLeft")) player -= dt * 0.7;
    if (keys.has("ArrowRight")) player += dt * 0.7;
    player = Math.min(0.92, Math.max(0.08, player));
    spawn -= dt;
    if (spawn <= 0) {
      blocks.push({ x: 0.08 + Math.random() * 0.84, y: -0.08, s: 0.05 + Math.random() * 0.03 });
      spawn = Math.max(0.28, 0.85 - seconds * 0.03);
    }
    blocks.forEach((b) => { b.y += dt * (0.35 + seconds * 0.02); });
    const px = player, py = 0.86, ps = 0.035;
    if (blocks.some((b) => Math.abs(b.x - px) < b.s + ps && Math.abs(b.y - py) < b.s + ps)) alive = false;
    blocks = blocks.filter((b) => b.y < 1.1);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#12131c";
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = "#efeaff";
  blocks.forEach((b) => ctx.fillRect((b.x - b.s) * w, (b.y - b.s) * h, b.s * 2 * w, b.s * 2 * h));
  ctx.fillStyle = "#7ee7f5";
  ctx.fillRect((player - 0.035) * w, 0.86 * h, 0.07 * w, 0.07 * w);
  ctx.fillStyle = "#f4f1ff";
  ctx.font = "600 22px Outfit, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText(seconds.toFixed(1) + "s", 16, 32);
  if (!alive) {
    ctx.textAlign = "center";
    ctx.fillText("Hit", w / 2, h / 2);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
