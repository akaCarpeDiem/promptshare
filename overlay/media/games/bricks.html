<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brick court</title>
  <style>
    html, body { margin: 0; height: 100%; background: #12131c; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let w = 640, h = 360, dpr = 1;
const cols = 8, rows = 4;
let bricks = [];
let ball = { x: 0.5, y: 0.7, vx: 0.28, vy: -0.36 };
let paddle = 0.5;
let over = false;
function makeBricks() {
  bricks = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) bricks.push({ c, r, on: true, violet: (r + c) % 2 === 0 });
}
makeBricks();
function fit() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  w = canvas.clientWidth || 640;
  h = canvas.clientHeight || 360;
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
}
addEventListener("resize", fit);
function aim(e) {
  const r = canvas.getBoundingClientRect();
  paddle = Math.min(0.88, Math.max(0.12, (e.clientX - r.left) / r.width));
}
canvas.addEventListener("pointermove", aim);
canvas.addEventListener("pointerdown", (e) => {
  if (over) { over = false; ball = { x: 0.5, y: 0.7, vx: 0.28, vy: -0.36 }; makeBricks(); }
  aim(e);
});
function leftCount() { return bricks.filter((b) => b.on).length; }
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  fit();
  if (!over) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    if (ball.x < 0.03 || ball.x > 0.97) ball.vx *= -1;
    if (ball.y < 0.04) ball.vy = Math.abs(ball.vy);
    const py = 0.9;
    if (ball.vy > 0 && ball.y > py - 0.02 && ball.y < py + 0.03 && Math.abs(ball.x - paddle) < 0.12) {
      ball.vy = -Math.abs(ball.vy);
      ball.vx += (ball.x - paddle) * 1.2;
    }
    bricks.forEach((b) => {
      if (!b.on) return;
      const bx = 0.08 + b.c * 0.105, by = 0.1 + b.r * 0.07;
      if (ball.x > bx && ball.x < bx + 0.095 && ball.y > by && ball.y < by + 0.055) {
        b.on = false;
        ball.vy *= -1;
      }
    });
    if (ball.y > 1.05 || leftCount() === 0) over = true;
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#12131c";
  ctx.fillRect(0, 0, w, h);
  bricks.forEach((b) => {
    if (!b.on) return;
    ctx.fillStyle = b.violet ? "#c4a6ff" : "#7ee7f5";
    ctx.fillRect((0.08 + b.c * 0.105) * w, (0.1 + b.r * 0.07) * h, 0.09 * w, 0.05 * h);
  });
  ctx.fillStyle = "#efeaff";
  ctx.fillRect((paddle - 0.1) * w, 0.9 * h, 0.2 * w, 10);
  ctx.beginPath();
  ctx.arc(ball.x * w, ball.y * h, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#f4f1ff";
  ctx.font = "600 20px Outfit, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText(String(leftCount()), 16, 28);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
