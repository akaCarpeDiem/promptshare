<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orbit flip</title>
  <style>
    html, body { margin: 0; height: 100%; background: #12131c; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let w = 640, h = 360, dpr = 1;
let angle = 0;
let radius = 0.62;
let pull = -1;
let alive = true;
let seconds = 0;
let last = performance.now();
function fit() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  w = canvas.clientWidth || 640;
  h = canvas.clientHeight || 360;
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
}
addEventListener("resize", fit);
function flip() { if (alive) pull *= -1; else { alive = true; seconds = 0; radius = 0.62; pull = -1; } }
canvas.addEventListener("pointerdown", flip);
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  fit();
  if (alive) {
    seconds += dt;
    angle += dt * 1.7 * (pull > 0 ? 1 : -1);
    radius += pull * dt * 0.16;
    if (radius < 0.34 || radius > 0.92) alive = false;
  }
  const cx = w / 2, cy = h / 2, scale = Math.min(w, h) * 0.46;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#12131c";
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = "rgba(196,166,255,0.45)";
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.arc(cx, cy, scale * 0.63, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = "#c4a6ff";
  ctx.beginPath();
  ctx.arc(cx, cy, scale * 0.16, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#7ee7f5";
  ctx.beginPath();
  ctx.arc(cx + Math.cos(angle) * scale * radius, cy + Math.sin(angle) * scale * radius, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#f4f1ff";
  ctx.font = "600 22px Outfit, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText(seconds.toFixed(1) + "s", 16, 32);
  if (!alive) {
    ctx.textAlign = "center";
    ctx.fillText("Left the ring", w / 2, h - 28);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
